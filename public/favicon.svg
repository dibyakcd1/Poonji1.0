
  <svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#7C68EE" />
        <stop offset="100%" stop-color="#5544CE" />
      </linearGradient>
      <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FFD43B" />
        <stop offset="100%" stop-color="#FFA94D" />
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
      </filter>
    </defs>

    <!-- Background -->
    <rect width="128" height="128" fill="url(#bgGrad)" rx="28.16" />

    <!-- Subtle inner glowing ring -->
    <circle cx="64" cy="64" r="54.4" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.92" />

    <!-- Centered ₹ (Rupee) & Capital Growth glyph -->
    <g transform="translate(64, 64) scale(0.85)" filter="url(#shadow)">
      <!-- Top Bar 1 -->
      <rect x="-28.16" y="-35.84" width="56.32" height="7.68" rx="3.84" fill="#FFFFFF" />
      
      <!-- Top Bar 2 -->
      <rect x="-28.16" y="-21.76" width="56.32" height="7.68" rx="3.84" fill="#FFFFFF" />
      
      <!-- Vertical Stem -->
      <rect x="-28.16" y="-35.84" width="8.96" height="40.96" rx="3.84" fill="#FFFFFF" />
      
      <!-- Upper Semi-circle loop -->
      <path d="M -19.2 -35.84 L 0 -35.84 A 20.48 20.48 0 0 1 0 5.12 L -19.2 5.12" 
            fill="none" stroke="#FFFFFF" stroke-width="7.68" stroke-linecap="round" />
      
      <!-- Dynamic Growth Arrow Slant -->
      <path d="M -15.36 -1.28 L 23.04 38.4" 
            stroke="url(#goldGrad)" stroke-width="9.6" stroke-linecap="round" />
      <polygon points="12.8,38.4 32,38.4 32,19.2" fill="#FFD43B" />
    </g>
  </svg>
  