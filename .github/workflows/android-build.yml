name: Build Android App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://haqwhylcdhtxzghvqxil.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_wDxh9qcmzFFVPrJLNRiZNQ_-iJMRZVe' }}
        run: npm run build

      - name: Create Android project (first run only) and sync web assets
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android
          chmod +x android/gradlew

      # ---------- Debug APK (always; installable directly on any phone) ----------
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Poonji-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # ---------- Signed release (only when keystore secrets are configured) ----------
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build release APK and AAB
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Sign release APK and AAB
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir -p out
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KS_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out out/Poonji-release.apk android/app/build/outputs/apk/release/app-release-unsigned.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/Poonji-release.aab
          jarsigner -keystore "$RUNNER_TEMP/release.keystore" -storepass "$KS_PASSWORD" \
            -keypass "$KEY_PASSWORD" out/Poonji-release.aab "$KEY_ALIAS"

      - name: Upload signed release
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Poonji-release-signed
          path: out/*
